<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disposition Planner — tests</title>
<style>
  :root { --bg: #f3f4f8; --surface: #fff; --line: #d8dce8; --fg: #171a2b; --fg-2: #434964; --ok: #1c7c44; --ok-soft: #e2f3e9; --bad: #b3261e; --bad-soft: #fbe7e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e111c; --surface: #171b2b; --line: #2c3249; --fg: #eef0f8; --fg-2: #bcc1d8; --ok: #62d394; --ok-soft: #12301f; --bad: #ff9088; --bad-soft: #3a1714; color-scheme: dark; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 1rem/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 1.25rem; margin: 0; }
  p { margin: 0; color: var(--fg-2); }
  #verdict { font-size: 1.375rem; font-weight: 700; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  #verdict.pass { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  #verdict.fail { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  ul { margin: 0; padding: 0; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  li { padding: 10px 14px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  li:first-child { border-top: 0; }
  li b { color: var(--ok); } li.bad b { color: var(--bad); }
  code { font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>Disposition Planner — tests</h1>
  <p>Walks every path through the tool using the rules in <code>index.html</code> and compares each result with the recorded list in <code>checks/golden-paths.json</code>. Open this page on the live site after any change.</p>
  <div id="verdict" role="status">Running…</div>
  <ul id="out"></ul>
</main>
<script>
(function() {
  var out = document.getElementById('out'), verdict = document.getElementById('verdict'), failed = 0;
  function line(ok, text) {
    if (!ok) failed++;
    var li = document.createElement('li'); if (!ok) li.className = 'bad';
    var b = document.createElement('b'); b.textContent = ok ? '✓ ' : '✕ ';
    li.appendChild(b); li.appendChild(document.createTextNode(text)); out.appendChild(li);
  }
  function get(url) { return fetch(url, { cache: 'no-store' }).then(function(r) { if (!r.ok) throw new Error(url + ': ' + r.status); return r.text(); }); }

  Promise.all([get('index.html'), get('checks/walk.js'), get('checks/golden-paths.json')]).then(function(files) {
    var block = new DOMParser().parseFromString(files[0], 'text/html').getElementById('dp-logic');
    if (!block) throw new Error('index.html has no <script id="dp-logic"> block');
    (0, eval)(block.textContent + '\n' + files[1]);   // defines the rules and walkAll() as globals

    var w = walkAll(), rec = JSON.parse(files[2]), golden = rec.paths, old = {}, seen = {};
    golden.forEach(function(p) { old[p.a] = p; });
    line(true, w.paths.length + ' paths walked');

    var problems = w.problems.concat(invariants(w.paths));
    line(!problems.length, problems.length ? problems.length + ' rule problem(s)' : 'Checks that must always hold: all pass');
    problems.slice(0, 20).forEach(function(p) { line(false, p); });

    var changed = [], added = [];
    w.paths.forEach(function(p) {
      seen[p.a] = true;
      if (!old[p.a]) added.push(p.a);
      else if (JSON.stringify(p) !== JSON.stringify(old[p.a])) changed.push(p.a);
    });
    var gone = golden.filter(function(p) { return !seen[p.a]; }).map(function(p) { return p.a; });
    line(!changed.length && !added.length && !gone.length,
      changed.length || added.length || gone.length
        ? changed.length + ' changed, ' + added.length + ' new, ' + gone.length + ' gone, compared with the recorded list'
        : 'Every path matches the recorded list (' + golden.length + ')');
    [['Changed', changed], ['New', added], ['Gone', gone]].forEach(function(g) {
      g[1].slice(0, 20).forEach(function(a) { line(false, g[0] + ': ' + a); });
    });

    line(JSON.stringify(allText()) === JSON.stringify(rec.text), JSON.stringify(allText()) === JSON.stringify(rec.text) ? 'Wording matches the recorded list' : 'Wording differs from the recorded list (questions, definitions or destination text)');

    verdict.textContent = failed ? 'Failed' : 'All tests pass';
    verdict.className = failed ? 'fail' : 'pass';
  }).catch(function(e) {
    verdict.textContent = 'Could not run'; verdict.className = 'fail';
    line(false, String(e.message || e) + '. This page needs to be opened from a web address (the live site), not as a file.');
  });
})();
</script>
</body>
</html>
