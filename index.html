<!DOCTYPE html>
<html lang="en" data-text="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Disposition Planner — VA GMed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: questions on the left (top on a phone), a live list of every destination on the right. */
  :root {
    --bg: #f3f4f8; --surface: #ffffff; --surface-2: #eceef5; --line: #d8dce8; --line-strong: #868da8;
    --fg: #171a2b; --fg-2: #434964; --fg-3: #5a6180;
    --accent: #2f5bd8; --accent-soft: #e8eeff; --on-accent: #ffffff;
    --ok: #1c7c44; --ok-soft: #e2f3e9;
    --warn: #9a5b00; --warn-soft: #fcf0d9;
    --neutral-soft: #e6e8f0;
    --shadow: 0 1px 2px rgba(23, 26, 43, .05), 0 4px 14px rgba(23, 26, 43, .05);
    --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --r: 12px; --r-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e111c; --surface: #171b2b; --surface-2: #1f2438; --line: #2c3249; --line-strong: #6b7499;
      --fg: #eef0f8; --fg-2: #bcc1d8; --fg-3: #9da3bf;
      --accent: #88a5ff; --accent-soft: #1e2950; --on-accent: #0e111c;
      --ok: #62d394; --ok-soft: #12301f; --warn: #f1b45c; --warn-soft: #33250f;
      --neutral-soft: #262b40;
      --shadow: none; color-scheme: dark;
    }
  }
  /* Text size (A− / A+): everything is sized in rem, so this scales the whole page. */
  html[data-text="sm"] { font-size: 93.75%; }
  html[data-text="md"] { font-size: 100%; }
  html[data-text="lg"] { font-size: 112.5%; }
  html[data-text="xl"] { font-size: 125%; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 1rem; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
  ul { list-style: none; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .top-in, .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top-in { padding-block: 10px; display: flex; align-items: center; gap: 8px; }
  .top h1 { font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
  .top h1 small { font-family: var(--mono); font-size: .75rem; font-weight: 500; color: var(--fg-3); margin-left: 6px; }
  @media (max-width: 480px) { .top h1 small { display: none; } }
  .tbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); min-height: 44px; min-width: 44px; padding: 6px 12px; font-weight: 500; cursor: pointer; }
  .tbtn:disabled { opacity: .45; cursor: default; }
  .tsize { display: inline-flex; }
  .tsize .tbtn:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); font-size: .875rem; }
  .tsize .tbtn:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; border-left: 0; font-size: 1.0625rem; }

  .wrap { padding-block: 16px 96px; display: grid; gap: 20px; }
  @media (min-width: 920px) {
    .wrap { grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: start; padding-block: 24px 40px; }
    .jump { display: none !important; }
  }

  /* ── Questions ── */
  .ask { display: grid; gap: 14px; min-width: 0; }
  .lede { font-size: .9375rem; color: var(--fg-2); }
  .q { display: grid; gap: 2px; }
  .q-label { font-weight: 600; font-size: .9375rem; }
  .q-hint { font-size: .8125rem; color: var(--fg-3); }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .opts button { flex: 1 1 6.6em; min-width: min-content; max-width: 100%; min-height: 46px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); font-weight: 500; font-size: .9375rem; line-height: 1.2; cursor: pointer; }
  .opts button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .skipped { font-size: .8125rem; color: var(--fg-3); }
  .opt-tag { font-weight: 400; font-size: .8125rem; color: var(--fg-3); margin-left: 4px; }
  .q-top:has(.opt-tag) { min-height: 44px; }
  .opts.bars button { flex: 1 1 40%; }
  .after { display: grid; gap: 2px; margin-top: 6px; }
  .after h2 { font-size: 1.0625rem; font-weight: 700; }
  .after-note { font-size: .875rem; color: var(--fg-2); }
  .q-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .why { border: 0; background: none; padding: 4px 0 4px 12px; min-height: 44px; font-size: .8125rem; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .defs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: .875rem; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
  .defs dt { font-weight: 600; } .defs dd { color: var(--fg-2); }

  /* ── Board ── */
  .board { display: grid; gap: 14px; min-width: 0; scroll-margin-top: 96px; }
  .sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .sum b { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; }
  .sum span { color: var(--fg-2); font-size: .9375rem; }
  .today { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
  .today h2 { font-family: var(--mono); font-size: .75rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .today li { font-size: .9375rem; padding-left: 18px; position: relative; }
  .today li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }

  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .grp { font-family: var(--mono); font-size: .75rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); padding: 10px 14px 6px; background: var(--surface-2); }
  .d + .d, .grp + .d, .d + .grp { border-top: 1px solid var(--line); }
  .d-head { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; background: none; border: 0; padding: 12px 14px; min-height: 52px; cursor: pointer; }
  .ic { width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center; font-weight: 700; font-size: .875rem; background: var(--neutral-soft); color: var(--fg-3); }
  .d[data-st="yes"] .ic { background: var(--ok-soft); color: var(--ok); }
  .d[data-st="if"] .ic { background: var(--warn-soft); color: var(--warn); }
  .d[data-st="out"] .ic { background: transparent; color: var(--fg-3); border: 1px solid var(--line-strong); }
  .d-name { font-weight: 600; }
  .d-name small { font-weight: 400; font-size: .875rem; color: var(--fg-2); }
  .d-line { display: block; font-size: .875rem; color: var(--fg-2); }
  .d[data-st="if"] .d-line, .d-line.chk { color: var(--warn); }
  .d[data-st="out"] .d-name { color: var(--fg-2); font-weight: 500; }
  .first { display: block; font-family: var(--mono); font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .pill { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--neutral-soft); color: var(--fg-2); }
  .d[data-st="yes"] .pill { background: var(--ok-soft); color: var(--ok); }
  .d[data-st="if"] .pill { background: var(--warn-soft); color: var(--warn); }
  .exit { display: inline-block; margin-top: 4px; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); }
  .d-body { padding: 0 14px 14px 52px; font-size: .9375rem; }
  .d-body dt { font-family: var(--mono); font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); margin-top: 8px; }
  .d-body dt:first-child { margin-top: 0; }
  .d-body dd { color: var(--fg-2); }
  .out-toggle { width: 100%; text-align: left; background: var(--surface-2); border: 0; border-top: 1px solid var(--line); padding: 12px 14px; min-height: 48px; font-weight: 600; color: var(--fg-2); cursor: pointer; display: flex; justify-content: space-between; }
  .foot { font-size: .8125rem; color: var(--fg-3); display: grid; gap: 6px; }

  .jump { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .9375rem; }
  .jump button { border: 0; background: var(--accent); color: var(--on-accent); border-radius: var(--r-sm); min-height: 44px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  /* ── Glossary: tap an underlined term ── */
  .term { background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: help; border-bottom: 1.5px dotted currentColor; line-height: inherit; }
  .term:hover, .term[aria-expanded="true"] { border-bottom-style: solid; }
  #term-pop { position: absolute; z-index: 30; max-width: min(340px, calc(100vw - 16px)); background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 10px 13px; box-shadow: 0 6px 20px rgba(23, 26, 43, .14); font-size: .9375rem; line-height: 1.5; color: var(--fg-2); }
  #term-pop[hidden] { display: none; }
  .term-pop-title { font-weight: 600; color: var(--fg); }
  .term-pop-title span { font-weight: 400; color: var(--fg-3); }
  .term-pop-def { margin-top: 3px; }
</style>

<body>

<header class="top"><div class="top-in">
  <h1>Disposition Planner<small>VA GLA · GMed</small></h1>
  <div class="tsize" role="group" aria-label="Text size">
    <button type="button" class="tbtn" id="text-smaller" aria-label="Smaller text">A−</button>
    <button type="button" class="tbtn" id="text-larger" aria-label="Larger text">A+</button>
  </div>
  <button type="button" class="tbtn" id="clear">Clear</button>
</div></header>

<main class="wrap">
  <section class="ask" id="ask" aria-label="About the patient"></section>
  <section class="board" id="board" aria-label="Disposition options" tabindex="-1"></section>
</main>
<div class="jump" id="jump"><span id="jump-text"></span><button type="button" id="jump-btn">Options ↓</button></div>
<div class="sr" id="live" aria-live="polite"></div>
<div id="term-pop" role="note" aria-live="polite" hidden></div>

<!-- ============================================================
     dp-logic: the rules. The only place outcomes are decided.
     tests.html and checks/check.py load this block by its id.
     ============================================================ -->
<script id="dp-logic">
// Questions, in the order shown. extra = shown only once the first forks are answered.
// Each option: [answer code, label, what it means].
var QUESTIONS = [
  { k:'goal', label:'Goal of care', opts:[
    ['active','Active care','Continuing active or curative care'],
    ['comfort','Comfort-focused','Prognosis-limited, moving away from curative care. Runs through Palliative Care'] ] },
  { k:'skilled', label:'Skilled need', hint:'IV antibiotics, daily complex wound care, ongoing PT/OT, or first-time tube feeds over 50% of nutrition', opts:[
    ['yes','Yes','Opens skilled facility, home health and rehab options'],
    ['no','No','Custodial, housing or independent-living options'] ] },
  { k:'func', label:'Function', opts:[
    ['independent','Independent','ADLs and iADLs, including managing own medications'],
    ['assist','Some help','Transfers bed to chair alone; needs help with some ADLs'],
    ['dependent','Dependent','Significant ADL dependence, or cannot transfer alone'] ] },
  { k:'cog', label:'Cognition', opts:[
    ['intact','Intact','Has decision-making capacity'],
    ['impaired','Impaired','Some impairment, not a wandering or exit risk'],
    ['elope','Elopement risk','Severe impairment with wandering or exit-seeking. Needs a locked setting'] ] },
  { k:'home', label:'Housing', opts:[
    ['safe','Safe home','With caregiver support if needed'],
    ['unsafe','Home, support a concern','Has housing, but support or safety is a concern'],
    ['homeless','No stable housing','Homeless or no stable housing'] ] },
  { k:'surr', extra:true, label:'Surrogate decision-maker', opts:[
    ['yes','DPOA or conservator','Already in place'],
    ['no','None yet','No DPOA or conservator. If the patient cannot assign one, a capacity declaration is needed'] ] },
  { k:'sud', extra:true, label:'Active substance use', opts:[
    ['no','No','No active substance use disorder'],
    ['yes','Yes, wants treatment','Opens the DOM'],
    ['declines','Yes, not interested','Active use, not interested in treatment'] ] },
  { k:'fund', extra:true, label:'Paying for long-term care', opts:[
    ['medical','Medi-Cal','Has it or can get it. Covers custodial CNH; Medicare does not'],
    ['funds','Private funds','Can pay out of pocket'],
    ['none','Neither yet','Needs a benefits work-up with SW'] ] },
  { k:'sc', extra:true, label:'Service connection', opts:[
    ['high','70% or more','Qualifies for CLC long stay; VA may also pay for a CNH'],
    ['mid','60% + unemployability','Veteran must apply for unemployability'],
    ['low','Lower or unknown','CLC long stay unlikely; short stay still possible'] ] }
];

// A rule is [level, test, text]. level 'no' rules the destination out; 'if' makes it a Check.
// Every test is false while its question is unanswered.
var comfortOnly = ['no', function(s){ return s.goal === 'active'; }, 'Comfort-focused care only'];
var activeOnly  = ['no', function(s){ return s.goal === 'comfort'; }, 'Goal is comfort: see hospice options'];
var needsSkill  = ['no', function(s){ return s.skilled === 'no'; }, 'No skilled need'];
var noSkill     = ['no', function(s){ return s.skilled === 'yes'; }, 'Skilled need: use a skilled option'];
var noLongTermNeed = ['no', function(s){ return s.func === 'independent' && s.cog === 'intact' && s.home === 'safe'; }, 'Independent with a safe home: no long-term care need'];
var notLocked   = ['if', function(s){ return s.cog === 'elope'; }, 'Not a locked unit: see CLC Dementia Care'];
var sobriety    = ['if', function(s){ return s.sud === 'yes' || s.sud === 'declines'; }, 'Active substance use: some may need 90 days sobriety'];
var lockedCnh   = ['if', function(s){ return s.cog === 'elope' && s.surr !== 'yes'; }, 'Locked CNH needs a DPOA or conservator'];
var offRestraints = ['if', function(s){ return s.b_restraint === 'yes'; }, 'Must be off restraints and sitter before a CNH will accept'];
var hardRso     = ['if', function(s){ return s.b_rso === 'yes'; }, 'Harder to place: registered sex offender'];
var hardBari    = ['if', function(s){ return s.b_bari === 'yes'; }, 'Harder to place: over 300 lb'];
var hardBehav   = ['if', function(s){ return s.b_behav === 'yes'; }, 'Harder to place: behavioral issues'];
function shortStayExit(s) { return s.home === 'unsafe' || s.home === 'homeless'; }

// Destinations, least restrictive first within each group. The first one that fits is marked "Consider first".
var DEST = [
  { id:'home_indep', grp:'Home and housing', name:'Home', consult:'', what:'Discharge home, no skilled or custodial need.',
    rules:[ activeOnly,
      ['no', function(s){ return s.skilled === 'yes'; }, 'Skilled need: see Home with home health'],
      ['no', function(s){ return s.home === 'homeless'; }, 'No stable housing'],
      ['if', function(s){ return s.home === 'unsafe'; }, 'Home support is a concern: SW to assess'],
      ['if', function(s){ return s.cog === 'elope'; }, 'Elopement risk: needs round-the-clock supervision at home'],
      ['if', function(s){ return s.func === 'dependent'; }, 'Confirm a caregiver can manage at home'] ],
    sw:'Confirm follow-up, equipment and caregiver needs with SW/CM.' },
  { id:'home_hh', grp:'Home and housing', name:'Home with home health', consult:'SW/CM', what:'Skilled need met at home by visiting services.',
    rules:[ activeOnly, needsSkill,
      ['no', function(s){ return s.home === 'homeless'; }, 'No stable housing'],
      ['if', function(s){ return s.cog === 'elope'; }, 'Elopement risk: needs round-the-clock supervision at home'],
      ['if', function(s){ return s.home === 'unsafe'; }, 'Home support is a concern: SW to assess'],
      ['if', function(s){ return s.func === 'dependent'; }, 'Confirm a caregiver can manage at home'] ],
    sw:'Confirm the agency can cover the specific skilled need and start promptly.' },
  { id:'dom', grp:'Home and housing', name:'DOM', sub:'Domiciliary', consult:'DOM', what:'On-campus residential SUD treatment program.',
    rules:[ activeOnly, noSkill,
      ['no', function(s){ return s.func === 'assist' || s.func === 'dependent'; }, 'Must be independent in ADLs and medications'],
      ['no', function(s){ return s.cog === 'impaired' || s.cog === 'elope'; }, 'Must be cognitively intact'],
      ['no', function(s){ return s.sud === 'no' || s.sud === 'declines'; }, 'Needs active SUD and interest in treatment'] ],
    notes:['Suicide Risk Assessment and TB clearance', 'Does not need to be homeless'],
    sw:'SW coordinates. If the DOM is full, Tarzana may be offered.' },
  { id:'gpd', grp:'Home and housing', name:'GPD', sub:'Grant and Per Diem', consult:'GPD/CERS', what:'Transitional housing for homeless veterans.',
    rules:[ activeOnly, noSkill,
      ['no', function(s){ return s.home === 'safe' || s.home === 'unsafe'; }, 'For homeless veterans'],
      ['no', function(s){ return s.func === 'assist' || s.func === 'dependent'; }, 'Must be independent in ADLs and medications'],
      ['no', function(s){ return s.cog === 'elope'; }, 'Elopement risk: needs a locked setting'] ],
    notes:['On campus: New Directions (SUD treatment and low-demand), A Bridge Home (low-demand)'],
    sw:'SW coordinates placement. The New Directions treatment program requires active SUD.' },

  { id:'aru', grp:'Short stay: skilled or rehab', name:'ARU', sub:'Acute Rehab Unit, 2E', consult:'ARU', what:'Intensive inpatient rehab. PM&R becomes the primary team.', exit:shortStayExit,
    rules:[ activeOnly, needsSkill,
      ['no', function(s){ return s.func === 'dependent'; }, 'Cannot yet do over 3 hours of therapy a day'],
      ['if', function(s){ return s.func === 'assist'; }, 'Confirm over 3 hours of PT/OT a day is tolerated'], notLocked ],
    sw:'The PM&R resident must evaluate and accept before transfer.' },
  { id:'clc_short', grp:'Short stay: skilled or rehab', name:'CLC', sub:'short stay', consult:'CLC', what:'On-campus skilled or rehab short stay.', exit:shortStayExit,
    rules:[ activeOnly, needsSkill, notLocked ],
    notes:['No SC requirement', 'Limited PT/OT beds'],
    sw:'CLC staff must evaluate and accept. Flag early to SW.' },
  { id:'cnh_skilled', grp:'Short stay: skilled or rehab', name:'CNH / SNF', sub:'short-term skilled', consult:'CNH', what:'Short-term skilled stay in a community nursing facility.', exit:shortStayExit,
    rules:[ activeOnly, needsSkill,
      lockedCnh, offRestraints, hardRso, hardBari, hardBehav ],
    notes:['Medicare pays after 3 consecutive inpatient midnights (not obs) with Medicare days remaining', 'Will not accept restraints or a sitter'],
    sw:'PASRR Level 1 before the consult. Returning to a prior CNH: contact the CNH coordinators first.' },

  { id:'rcfe_open', grp:'Long-term', name:'RCFE', sub:'board and care / assisted living', consult:'Community resident care', what:'Non-medical assisted living. Help with ADLs, not nursing-level care.',
    rules:[ activeOnly, noSkill, noLongTermNeed,
      ['no', function(s){ return s.cog === 'elope'; }, 'Elopement risk: needs a secured setting'],
      ['no', function(s){ return s.func === 'dependent'; }, 'Must transfer bed to wheelchair alone'],
      ['if', function(s){ return s.fund === 'medical'; }, 'Medi-Cal does not pay room and board: ask SW about the Assisted Living Waiver'],
      ['if', function(s){ return s.fund === 'none'; }, 'Needs private funds: benefits work-up with SW'],
      sobriety ],
    notes:['Requires patient funds', 'TB clearance'],
    sw:'SW can pursue NSC pension, Aid & Attendance, or SSA/SSI/SSDI toward the cost.' },
  { id:'rcfe_memory', grp:'Long-term', name:'RCFE, secured', sub:'memory care', consult:'Community resident care', what:'Secured assisted living for cognitive impairment.',
    rules:[ activeOnly, noSkill,
      ['no', function(s){ return s.cog === 'intact'; }, 'For cognitive impairment'],
      ['no', function(s){ return s.func === 'dependent'; }, 'Must transfer bed to wheelchair alone'],
      ['if', function(s){ return s.cog === 'impaired' || s.cog === 'elope'; }, 'Needs private funds; costs more than open RCFE'],
      sobriety ],
    notes:['Requires patient funds', 'TB clearance'],
    sw:'Confirm independent transfers and pursue benefits with SW.' },
  { id:'cnh_custodial', grp:'Long-term', name:'CNH', sub:'long-term custodial, open or locked', consult:'CNH', what:'Long-term nursing-home placement for custodial needs.',
    rules:[ activeOnly, noSkill,
      ['no', function(s){ return s.func === 'independent' && s.cog === 'intact'; }, 'No nursing-home level need'],
      ['if', function(s){ return s.fund === 'none' && s.sc !== 'high'; }, 'Medicare does not pay: needs Medi-Cal or private funds'],
      ['if', function(s){ return s.fund === 'none' && s.sc === 'high'; }, 'VA may pay at 70% SC or more: ask the CNH coordinators'],
      lockedCnh, offRestraints, hardRso, hardBari, hardBehav ],
    notes:['Private funds can pay until spent down to Medi-Cal eligibility', 'Will not accept restraints or a sitter', 'Also harder to place: young, active substance use, Medi-Cal only, homeless'],
    sw:'PASRR Level 1 before the consult. A Medi-Cal number takes about 2 weeks and facilities need it.' },
  { id:'clc_long', grp:'Long-term', name:'CLC', sub:'long stay', consult:'CLC', what:'Indefinite on-campus custodial living.',
    rules:[ activeOnly, noSkill,
      ['no', function(s){ return s.func === 'independent' && s.cog === 'intact'; }, 'No nursing-home level need'],
      ['no', function(s){ return s.cog === 'elope'; }, 'Elopement risk: see CLC Dementia Care'],
      ['no', function(s){ return s.sc === 'low'; }, 'Needs 70% SC or more, or 60% with unemployability'],

      ['if', function(s){ return s.home === 'unsafe'; }, 'Home support uncertain: Palliative Care and SW to assess'] ],

  { id:'cnh_hospice', grp:'Hospice', name:'CNH with hospice', consult:'Palliative Care', what:'Comfort care in a nursing facility.',

function evalDest(d, s) {

function evalAll(s) { var res = {}; DEST.forEach(function(d) { res[d.id] = evalDest(d, s); }); return res; }

// Slow steps worth starting now.
function todayItems(s, res) {

  if (s.skilled === 'no' && s.fund === 'none' && s.func && s.cog && s.home && live('cnh_custodial')) t.push('Start the Medi-Cal application (number takes about 2 weeks)');
  if (DEST.some(function(d) { return res[d.id].exit; })) t.push('Agree an exit plan with SW for after the short stay (facilities may decline without one)');
  var housing = s.home === 'unsafe' || s.home === 'homeless';
  if (s.skilled === 'no' && housing && (s.func === 'assist' || s.func === 'dependent') && s.b_rso !== 'yes' && s.b_behav !== 'yes') t.push('Discuss CalVet with SW (waitlist a year or more)');

}
// Steps for now plus, when an exit plan is needed, the steps for the long-term plan.
function allToday(s) {

// What the board shows for a set of answers. A ruled-out option counts the same whatever the reason.
function signature(s) {
  function part(list, sv) { return list.map(function(d) { var r = evalDest(d, sv); return r.st === 'out' ? 'out' : [r.st, r.iff, r.exit]; }); }

function afterDests() { return DEST.filter(function(d) { return AFTER_IDS.indexOf(d.id) !== -1; }); }
// A question (or tick box) matters if some answer to it would change anything on the board.
function matters(q, s) {

  return q.opts.some(function(o) { return signature(withAnswer(s, q.k, o[0])) !== first; });

function barrierMatters(key, s) { return signature(withAnswer(s, key, 'yes')) !== signature(withAnswer(s, key, undefined)); }

// For a ruled-out destination: the single answers that, changed, would make it possible. Up to 3.
// Only answers that can realistically change or be clarified: not goal of care, skilled need or cognition.
var UNLOCK_KEYS = ['func', 'home', 'surr', 'sud', 'fund', 'sc'];
function unlocks(d, sv, skip) {
  var out = [];
  QUESTIONS.forEach(function(q) {
    if (!sv[q.k] || q.k === skip || UNLOCK_KEYS.indexOf(q.k) === -1) return;
    q.opts.forEach(function(o) {
      if (o[0] !== sv[q.k] && out.length < 3 && evalDest(d, withAnswer(sv, q.k, o[0])).st !== 'out') out.push(q.label + ': ' + o[1]);

}

// Everything the page shows for a set of answers.
//   ask: questions to show · left: those still unanswered · skipped: questions that cannot change anything
//   barriers: tick boxes worth showing
//   rows: every destination with st = 'yes' (fits) | 'if' (check) | 'open' (depends on an unanswered question) | 'out'
//   after: the same for the long-term options after a short stay, or null when no exit plan is needed
//   first: id of the destination to consider first, or null · firstLabel: the words for that tag
//   today: steps to start now · done: nothing left to ask
function boardFor(s) {
  var coreDone = !!s.goal && (s.goal === 'comfort' || !!s.skilled);
  var rel = QUESTIONS.filter(function(q) { return matters(q, s); });
  var ask = QUESTIONS.filter(function(q) { return (rel.indexOf(q) !== -1 && (!q.extra || coreDone)) || (q.extra && !coreDone && !!s[q.k]); });
  var left = rel.filter(function(q) { return !s[q.k]; });
  var skipped = QUESTIONS.filter(function(q) { return rel.indexOf(q) === -1; });
  function rowsFor(list, sv, skip) {
    return list.map(function(d) {
      var r = evalDest(d, sv), base = JSON.stringify(r);
      var open = r.st !== 'out' && left.some(function(q) { return q.opts.some(function(o) { return JSON.stringify(evalDest(d, withAnswer(sv, q.k, o[0]))) !== base; }); });
      return { d: d, st: open ? 'open' : r.st, no: r.no, iff: r.iff, exit: r.exit, unlock: r.st === 'out' ? unlocks(d, sv, skip) : [] };
    });
  }
  var rows = rowsFor(DEST, s), s2 = afterState(s);
  var after = s2 ? rowsFor(afterDests(), s2, 'skilled') : null;

  // Which to consider first: the first destination that fits, once nothing above it is still open.
  // Elopement risk: CLC Dementia Care is the usual first step whenever it is not ruled out.
  var live = rows.filter(function(x) { return x.st !== 'out'; }), first = null, firstLabel = 'Consider first';
  for (var i = 0; coreDone && i < live.length && live[i].st !== 'open'; i++) if (live[i].st === 'yes') { first = live[i].d.id; break; }
  var dc = rows.filter(function(x) { return x.d.id === 'clc_2n'; })[0];
  if (s.goal === 'active' && s.cog === 'elope' && coreDone && (dc.st === 'yes' || dc.st === 'if')) { first = 'clc_2n'; firstLabel = 'Usual first step'; }

  return { ask: ask, left: left, skipped: skipped, rows: rows, after: after, first: first, firstLabel: firstLabel,
    barriers: coreDone ? BARRIERS.filter(function(b) { return s[b[0]] === 'yes' || barrierMatters(b[0], s); }) : [],
    today: allToday(s), done: left.length === 0, coreDone: coreDone };
}

    if (!ain.length) o += '<div class="d" data-st="out"><div class="d-head"><span class="ic" aria-hidden="true">?</span><span><span class="d-name">No long-term option fits yet</span><span class="d-line">Needs a work-up with SW/CM.</span></span><span></span></div></div>';
    if (aout) {
      o += '<button type="button" class="out-toggle" id="after-toggle" aria-expanded="' + showAfterOut + '"><span>Ruled out · ' + aout + '</span><span aria-hidden="true">' + (showAfterOut ? '−' : '+') + '</span></button>';
      if (showAfterOut) b.after.forEach(function(x) { if (x.st === 'out') o += row(x, 'after-'); });
    }
    o += '</div>';
  }

  o += '<div class="foot">' +
    '<p class="foot-note">A guide, not a determination. Listed least restrictive first. Final disposition depends on beds, patient and family preference, insurance, and the judgment of SW/CM and the accepting service. Assumes the patient is medically stable to leave acute medicine.</p>' +
    '<p>More detail: <a href="https://tinyurl.com/vagladispo" target="_blank" rel="noopener">VA GLA Disposition Primer</a></p>' +
    '<p>Created by George Tran, MD · Last updated November 2026</p></div>';
  document.getElementById('board').innerHTML = o;

  document.getElementById('jump-text').textContent = sumMain + (b.done || none ? '' : ' · ' + shown + ' left');
  document.getElementById('live').textContent = none ? '' : sumMain + '. ' + sumSub + '.';
  document.getElementById('clear').disabled = none;
  linkTerms(document.querySelector('.wrap'));
  var again = keep && document.getElementById(keep);
  if (again && again !== document.activeElement) again.focus({ preventScroll: true });
}

document.addEventListener('click', function(e) {
  var t = e.target, opt = t.closest('.opts button[data-k]'), bar = t.closest('.opts button[data-bar]'), why = t.closest('.why'), head = t.closest('.d-head[data-id]');
  if (opt) { if (state[opt.dataset.k] === opt.dataset.v) delete state[opt.dataset.k]; else state[opt.dataset.k] = opt.dataset.v; render(); }
  else if (bar) { if (state[bar.dataset.bar]) delete state[bar.dataset.bar]; else state[bar.dataset.bar] = 'yes'; render(); }
  else if (why) { openWhy[why.dataset.why] = !openWhy[why.dataset.why]; render(); }
  else if (head) { openIds[head.dataset.id] = !openIds[head.dataset.id]; render(); }
  else if (t.closest('#out-toggle')) { showOut = !showOut; render(); }
  else if (t.closest('#after-toggle')) { showAfterOut = !showAfterOut; render(); }
  else if (t.closest('#clear')) { state = {}; openIds = {}; openWhy = {}; showOut = false; showAfterOut = false; render(); window.scrollTo(0, 0); var f = document.querySelector('.opts button'); if (f) f.focus({ preventScroll: true }); }
  else if (t.closest('#jump-btn')) { var bd = document.getElementById('board'); bd.scrollIntoView(); bd.focus({ preventScroll: true }); }
  else if (t.closest('#text-smaller')) changeTextSize(-1);
  else if (t.closest('#text-larger')) changeTextSize(1);
});

// Text size (A− / A+), remembered per browser; works without storage.
var TEXT_SIZES = ['sm', 'md', 'lg', 'xl'], TEXT_SIZE_KEY = 'dispo-text-size', textSizeIdx = 1;
function applyTextSize() {
  document.documentElement.setAttribute('data-text', TEXT_SIZES[textSizeIdx]);
  document.getElementById('text-smaller').disabled = (textSizeIdx === 0);
  document.getElementById('text-larger').disabled = (textSizeIdx === TEXT_SIZES.length - 1);
}
function changeTextSize(delta) {
  textSizeIdx = Math.max(0, Math.min(TEXT_SIZES.length - 1, textSizeIdx + delta));
  applyTextSize();
  try { localStorage.setItem(TEXT_SIZE_KEY, TEXT_SIZES[textSizeIdx]); } catch (e) {}
}

try { var saved = TEXT_SIZES.indexOf(localStorage.getItem(TEXT_SIZE_KEY)); if (saved !== -1) textSizeIdx = saved; } catch (e) {}
applyTextSize();
render();
</script>
